<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="frontend.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <img src="Assets/SMEDG_.png" width="158" height="30" alt="SMEDG Logo">
    <input class="login" type="text" id="username" placeholder="Username" />
    <input class="login" type="password" id="password" placeholder="Password" />
    <button class="login-button" onclick="login()">Login</button>
    <div id="error-message" class="error"></div>
  </div>
  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');

      //admin
      const adminUsername = "admin";
      const adminPassword = "1234";

      //guest
      const guestUsername = "guest";
      const guestPassword = "1234";

      if (username === "" || password === "") {
        errorMessage.textContent = "Please enter both fields.";
        return;
      }

      if (username === adminUsername && password === adminPassword) {
        localStorage.setItem("currentUserRole", "admin");
        window.location.href = "dashboard.html"; 
      } else if (username === guestUsername && password === guestPassword) {
        localStorage.setItem("currentUserRole", "guest");
        window.location.href = "dashboard.html";
      } else {
        errorMessage.textContent = "Invalid username or password.";
      }
    }
  </script>
</body>
</html>
