<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="frontend.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header>
        <div class="left-container">
            <a href="dashboard.html">
                <img src="Assets/SMEDG_.png" width="158" height="30" alt="SMEDG Logo"> 
            </a>
        </div>
        <div class="right-container">
         <a href="policy.html" class="p button">View Policies</a>
         <a href="login.html" class="logout button">Logout</a>
        </div>
    </header>
    <main>
        <div class="center-container">
            <button class="va button">Validate</button>
            <button class="ex button">Export</button>
        </div>
        <div class="table-container">
            <span class="badge">5</span>
            <table id="dynamicTable">
                <thead>
                    <tr>
                    <th style="width:10%">Policy</th>
                    <th style="width:30%">Issue</th>
                    <th style="width:20%">Asset</th>
                    <th style="width:13%">Severity</th>
                    <th style="width:30%">Recommendation</th>
                    </tr>
                </thead>
            </table>
        </div>
    </main>
    <script src="dashboard.js"></script>
</body>
</html>
